openapi: 3.0.3
info:
  title: Library Management API
  description: |
    RESTful API for managing a library system including authors, books, and borrowing records.
    
    ## Features
    - Author management (CRUD)
    - Book management (CRUD) with author relationships
    - Book borrowing and return system
    - Borrow history tracking
    
    ## Business Rules
    - Books must be associated with existing authors
    - A book can only be borrowed if it's not currently borrowed
    - Users must return books before they can be borrowed again
  version: 1.0.0
 
servers:
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://api.library.example.com/api
    description: Production server

tags:
  - name: Authors
    description: Author management endpoints
  - name: Books
    description: Book management endpoints
  - name: Borrowing
    description: Book borrowing and return endpoints

paths:
  # ==================== AUTHORS ====================
  /authors:
    get:
      tags:
        - Authors
      summary: List all authors
      description: Retrieve a paginated list of all authors
      operationId: listAuthors
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Author'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
              example:
                data:
                  - id: 1
                    name: "J.K. Rowling"
                    bio: "British author, best known for Harry Potter series"
                    dob: "1965-07-31"
                    created_at: "2025-01-15T10:30:00.000000Z"
                    updated_at: "2025-01-15T10:30:00.000000Z"
                  - id: 2
                    name: "George Orwell"
                    bio: "English novelist and essayist"
                    dob: "1903-06-25"
                    created_at: "2025-01-15T11:00:00.000000Z"
                    updated_at: "2025-01-15T11:00:00.000000Z"
                meta:
                  current_page: 1
                  last_page: 3
                  per_page: 15
                  total: 42
                links:
                  first: "http://localhost:8000/api/authors?page=1"
                  last: "http://localhost:8000/api/authors?page=3"
                  prev: null
                  next: "http://localhost:8000/api/authors?page=2"
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - Authors
      summary: Create a new author
      description: Create a new author with name, biography, and date of birth
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
            example:
              name: "Neil Gaiman"
              bio: "English author of short fiction, novels, comic books, and films"
              dob: "1960-11-10"
      responses:
        '201':
          description: Author created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Author'
              example:
                data:
                  id: 3
                  name: "Neil Gaiman"
                  bio: "English author of short fiction, novels, comic books, and films"
                  dob: "1960-11-10"
                  created_at: "2025-01-16T09:20:00.000000Z"
                  updated_at: "2025-01-16T09:20:00.000000Z"
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors/{id}:
    get:
      tags:
        - Authors
      summary: Get author by ID
      description: Retrieve detailed information about a specific author
      operationId: getAuthor
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Author'
              example:
                data:
                  id: 1
                  name: "J.K. Rowling"
                  bio: "British author, best known for Harry Potter series"
                  dob: "1965-07-31"
                  created_at: "2025-01-15T10:30:00.000000Z"
                  updated_at: "2025-01-15T10:30:00.000000Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags:
        - Authors
      summary: Update an author
      description: Update an existing author's information
      operationId: updateAuthor
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
            example:
              name: "J.K. Rowling"
              bio: "British author, philanthropist, and creator of the Harry Potter fantasy series"
              dob: "1965-07-31"
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Author'
              example:
                data:
                  id: 1
                  name: "J.K. Rowling"
                  bio: "British author, philanthropist, and creator of the Harry Potter fantasy series"
                  dob: "1965-07-31"
                  created_at: "2025-01-15T10:30:00.000000Z"
                  updated_at: "2025-01-16T14:22:00.000000Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags:
        - Authors
      summary: Delete an author
      description: |
        Delete an author from the system.
        **Note:** If implementing the bonus feature, this will fail if the author has associated books.
      operationId: deleteAuthor
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Author deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict - Cannot delete author with associated books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Cannot delete author with associated books"
                errors:
                  author: ["This author has books and cannot be deleted"]
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== BOOKS ====================
  /books:
    get:
      tags:
        - Books
      summary: List all books
      description: Retrieve a paginated list of all books with their author information
      operationId: listBooks
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
              example:
                data:
                  - id: 1
                    title: "Harry Potter and the Philosopher's Stone"
                    description: "The first novel in the Harry Potter series"
                    year: 1997
                    author_id: 1
                    author:
                      id: 1
                      name: "J.K. Rowling"
                    created_at: "2025-01-15T12:00:00.000000Z"
                    updated_at: "2025-01-15T12:00:00.000000Z"
                  - id: 2
                    title: "1984"
                    description: "A dystopian social science fiction novel"
                    year: 1949
                    author_id: 2
                    author:
                      id: 2
                      name: "George Orwell"
                    created_at: "2025-01-15T12:30:00.000000Z"
                    updated_at: "2025-01-15T12:30:00.000000Z"
                meta:
                  current_page: 1
                  last_page: 5
                  per_page: 15
                  total: 68
                links:
                  first: "http://localhost:8000/api/books?page=1"
                  last: "http://localhost:8000/api/books?page=5"
                  prev: null
                  next: "http://localhost:8000/api/books?page=2"
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - Books
      summary: Create a new book
      description: |
        Create a new book and associate it with an existing author.
        **Validation:** The author_id must reference an existing author.
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
            example:
              title: "American Gods"
              description: "A blend of Americana, fantasy, and mythology"
              year: 2001
              author_id: 3
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Book'
              example:
                data:
                  id: 3
                  title: "American Gods"
                  description: "A blend of Americana, fantasy, and mythology"
                  year: 2001
                  author_id: 3
                  author:
                    id: 3
                    name: "Neil Gaiman"
                  created_at: "2025-01-16T10:15:00.000000Z"
                  updated_at: "2025-01-16T10:15:00.000000Z"
        '422':
          description: Validation error - Invalid author_id or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "The given data was invalid."
                errors:
                  author_id: ["The selected author does not exist."]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{id}:
    get:
      tags:
        - Books
      summary: Get book by ID
      description: Retrieve detailed information about a specific book including author details
      operationId: getBook
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Book'
              example:
                data:
                  id: 1
                  title: "Harry Potter and the Philosopher's Stone"
                  description: "The first novel in the Harry Potter series"
                  year: 1997
                  author_id: 1
                  author:
                    id: 1
                    name: "J.K. Rowling"
                  created_at: "2025-01-15T12:00:00.000000Z"
                  updated_at: "2025-01-15T12:00:00.000000Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags:
        - Books
      summary: Update a book
      description: Update an existing book's information
      operationId: updateBook
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
            example:
              title: "Harry Potter and the Sorcerer's Stone"
              description: "The first novel in the Harry Potter series (US title)"
              year: 1998
              author_id: 1
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Book'
              example:
                data:
                  id: 1
                  title: "Harry Potter and the Sorcerer's Stone"
                  description: "The first novel in the Harry Potter series (US title)"
                  year: 1998
                  author_id: 1
                  author:
                    id: 1
                    name: "J.K. Rowling"
                  created_at: "2025-01-15T12:00:00.000000Z"
                  updated_at: "2025-01-16T15:45:00.000000Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags:
        - Books
      summary: Delete a book
      description: |
        Delete a book from the system.
        **Note:** If implementing soft deletes (bonus), the book will be soft deleted instead.
      operationId: deleteBook
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Book deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== BORROWING ====================
  /borrow:
    post:
      tags:
        - Borrowing
      summary: Borrow a book
      description: |
        Allow a user to borrow a book.
        **Business Rule:** A book can only be borrowed if it's not currently borrowed by someone else.
      operationId: borrowBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowInput'
            example:
              user_name: "Ahmed Ashraf"
              book_id: 1
      responses:
        '201':
          description: Book borrowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowRecord'
              example:
                data:
                  id: 1
                  user_name: "Ahmed Ashraf"
                  book_id: 1
                  book:
                    id: 1
                    title: "Harry Potter and the Philosopher's Stone"
                  borrow_at: "2025-01-16T14:30:00.000000Z"
                  return_at: null
                  created_at: "2025-01-16T14:30:00.000000Z"
                  updated_at: "2025-01-16T14:30:00.000000Z"
        '422':
          description: Validation error or book already borrowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyBorrowed:
                  summary: Book already borrowed
                  value:
                    message: "The book is already borrowed."
                    errors:
                      book_id: ["This book is currently borrowed and unavailable."]
                invalidBook:
                  summary: Invalid book ID
                  value:
                    message: "The given data was invalid."
                    errors:
                      book_id: ["The selected book does not exist."]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /return/{borrow_id}:
    post:
      tags:
        - Borrowing
      summary: Return a borrowed book
      description: |
        Mark a borrowed book as returned by updating the return_at timestamp.
        After returning, the book becomes available for borrowing again.
      operationId: returnBook
      parameters:
        - name: borrow_id
          in: path
          required: true
          description: The ID of the borrow record
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Book returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BorrowRecord'
              example:
                data:
                  id: 1
                  user_name: "Ahmed Ashraf"
                  book_id: 1
                  book:
                    id: 1
                    title: "Harry Potter and the Philosopher's Stone"
                  borrow_at: "2025-01-16T14:30:00.000000Z"
                  return_at: "2025-01-17T10:15:00.000000Z"
                  created_at: "2025-01-16T14:30:00.000000Z"
                  updated_at: "2025-01-17T10:15:00.000000Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Book already returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "This book has already been returned."
                errors:
                  borrow_id: ["The book was already returned on 2025-01-17."]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /borrow/history:
    get:
      tags:
        - Borrowing
      summary: Get borrowing history
      description: |
        Retrieve all borrow records including both active borrows and returned books.
        Useful for tracking library usage and generating reports.
      operationId: getBorrowHistory
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: Filter by borrow status
          required: false
          schema:
            type: string
            enum: [active, returned, all]
            default: all
          example: active
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BorrowRecord'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
              example:
                data:
                  - id: 1
                    user_name: "Ahmed Ashraf"
                    book_id: 1
                    book:
                      id: 1
                      title: "Harry Potter and the Philosopher's Stone"
                    borrow_at: "2025-01-16T14:30:00.000000Z"
                    return_at: "2025-01-17T10:15:00.000000Z"
                    created_at: "2025-01-16T14:30:00.000000Z"
                    updated_at: "2025-01-17T10:15:00.000000Z"
                  - id: 2
                    user_name: "Sara Mohamed"
                    book_id: 2
                    book:
                      id: 2
                      title: "1984"
                    borrow_at: "2025-01-17T09:00:00.000000Z"
                    return_at: null
                    created_at: "2025-01-17T09:00:00.000000Z"
                    updated_at: "2025-01-17T09:00:00.000000Z"
                meta:
                  current_page: 1
                  last_page: 2
                  per_page: 15
                  total: 24
                links:
                  first: "http://localhost:8000/api/borrow/history?page=1"
                  last: "http://localhost:8000/api/borrow/history?page=2"
                  prev: null
                  next: "http://localhost:8000/api/borrow/history?page=2"
        '500':
          $ref: '#/components/responses/InternalServerError'

# ==================== COMPONENTS ====================
components:
  schemas:
    # Author Schemas
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "J.K. Rowling"
        bio:
          type: string
          nullable: true
          example: "British author, best known for Harry Potter series"
        dob:
          type: string
          format: date
          example: "1965-07-31"
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00.000000Z"
    
    AuthorInput:
      type: object
      required:
        - name
        - dob
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Neil Gaiman"
        bio:
          type: string
          nullable: true
          maxLength: 1000
          example: "English author of short fiction, novels, comic books, and films"
        dob:
          type: string
          format: date
          example: "1960-11-10"
          description: "Date of birth in YYYY-MM-DD format"

    # Book Schemas
    Book:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Harry Potter and the Philosopher's Stone"
        description:
          type: string
          example: "The first novel in the Harry Potter series"
        year:
          type: integer
          example: 1997
        author_id:
          type: integer
          example: 1
        author:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "J.K. Rowling"
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T12:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-15T12:00:00.000000Z"
    
    BookInput:
      type: object
      required:
        - title
        - year
        - author_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "American Gods"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "A blend of Americana, fantasy, and mythology"
        year:
          type: integer
          minimum: 1000
          maximum: 2100
          example: 2001
          description: "Publication year"
        author_id:
          type: integer
          example: 3
          description: "Must reference an existing author ID"

    # Borrow Record Schemas
    BorrowRecord:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_name:
          type: string
          example: "Ahmed Ashraf"
        book_id:
          type: integer
          example: 1
        book:
          type: object
          properties:
            id:
              type: integer
              example: 1
            title:
              type: string
              example: "Harry Potter and the Philosopher's Stone"
        borrow_at:
          type: string
          format: date-time
          example: "2025-01-16T14:30:00.000000Z"
        return_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2025-01-16T14:30:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-16T14:30:00.000000Z"
    
    BorrowInput:
      type: object
      required:
        - user_name
        - book_id
      properties:
        user_name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Ahmed Ashraf"
          description: "Name of the person borrowing the book"
        book_id:
          type: integer
          example: 1
          description: "ID of the book to borrow (must exist and not be currently borrowed)"

    # Pagination Schemas
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 3
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 42
    
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
          example: "http://localhost:8000/api/authors?page=1"
        last:
          type: string
          format: uri
          example: "http://localhost:8000/api/authors?page=3"
        prev:
          type: string
          format: uri
          nullable: true
          example: null
        next:
          type: string
          format: uri
          nullable: true
          example: "http://localhost:8000/api/authors?page=2"

    # Error Schema
    Error:
      type: object
      properties:
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            name: ["The name field is required."]
            dob: ["The dob must be a valid date."]

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
        example: 1
    
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    
    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
        example: 15

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Resource not found."
            errors:
              id: ["The requested resource does not exist."]
    
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "The given data was invalid."
            errors:
              name: ["The name field is required."]
              dob: ["The dob must be a valid date."]
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "An error occurred while processing your request."
            errors: {}